# Minimal EvalHub for workshop UI Evaluations (lm-evaluation-harness + MLflow).
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: EvalHub
metadata:
  name: evalhub
  namespace: evalhub
spec:
  replicas: 1
  database:
    type: postgresql
    secret: evalhub-db-credentials
  providers:
    - lm-evaluation-harness
  collections: []
  env:
    - name: MLFLOW_TRACKING_URI
      # In-cluster MLflow (TLS on :8443) from examples/evalhub/mlflow.yaml
      value: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443"
