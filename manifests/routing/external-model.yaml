# Template for MaaS ExternalModel (maas.opendatahub.io).
# Do not put real API keys here. Preferred: bash manifests/apply-external-model.sh
# with MODEL_NAME, ENDPOINT, API_KEY (see módulo 8.3).
#
# spec.endpoint is an FQDN only (no scheme or path), e.g. maas.apps.tmm.example.com
apiVersion: v1
kind: Secret
metadata:
  name: tmm-api-key
  namespace: llm
  labels:
    inference.llm-d.ai/ipp-managed: "true"
type: Opaque
stringData:
  api-key: REPLACE_ME
  OPENAI_API_KEY: REPLACE_ME
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: tmm-external
  namespace: llm
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  provider: openai
  endpoint: REPLACE_FQDN
  targetModel: REPLACE_MODEL
  credentialRef:
    name: tmm-api-key
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: tmm-external
  namespace: llm
spec:
  modelRef:
    kind: ExternalModel
    name: tmm-external
