apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: gpt-oss-20b-authenticated-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "gpt-oss-20b authenticated access"
spec:
  modelRefs:
    - name: gpt-oss-20b
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: gpt-oss-20b-authenticated
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "gpt-oss-20b authenticated"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  priority: 10
  modelRefs:
    - name: gpt-oss-20b
      namespace: llm
      tokenRateLimits:
        - limit: 500
          window: 30s
        - limit: 5000
          window: 5m
