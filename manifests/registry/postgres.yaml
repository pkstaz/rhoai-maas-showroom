apiVersion: v1
kind: Secret
metadata:
  name: model-registry-db
  namespace: rhoai-model-registries
type: Opaque
stringData:
  database-name: model-registry
  database-user: modelregistryuser
  # workshop-only: ephemeral lab Postgres password (not production)
  # gitleaks:allow
  database-password: registry-workshop # pragma: allowlist secret
---
apiVersion: v1
kind: Service
metadata:
  name: model-registry-db
  namespace: rhoai-model-registries
spec:
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: model-registry-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-registry-db
  namespace: rhoai-model-registries
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-registry-db
  template:
    metadata:
      labels:
        app: model-registry-db
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: model-registry-db
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-registry-db
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: model-registry-db
                  key: database-name
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
