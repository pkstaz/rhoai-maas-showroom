---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.plugin.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.plugin.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.plugin.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.plugin.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.plugin.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.plugin.port }}
              name: https
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.plugin.port }}"
            - name: PLUGIN_DIST_DIR
              value: /app/dist
            - name: GPU_OPERATOR_NAMESPACE
              value: {{ .Values.gpuOperatorNamespace }}
            - name: BOOKING_PLUGIN_NAMESPACE
              value: {{ .Values.bookingPluginNamespace }}
            {{- if .Values.tls.enabled }}
            - name: TLS_CERT_FILE
              value: /var/serving-cert/tls.crt
            - name: TLS_KEY_FILE
              value: /var/serving-cert/tls.key
            {{- end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: serving-cert
              mountPath: /var/serving-cert
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.plugin.port }}
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.plugin.port }}
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.tls.enabled }}
      volumes:
        - name: serving-cert
          secret:
            secretName: {{ .Values.plugin.name }}-cert
      {{- end }}
