# Prometheus in redhat-ods-monitoring has no rights in nvidia-gpu-operator.
# Without this, kubernetes_sd for the DCGM ServiceMonitor discovers 0 targets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-dcgm-scrape
  namespace: nvidia-gpu-operator
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-dcgm-scrape
  namespace: nvidia-gpu-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-dcgm-scrape
subjects:
  - kind: ServiceAccount
    name: data-science-monitoringstack-prometheus
    namespace: redhat-ods-monitoring
