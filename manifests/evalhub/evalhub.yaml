# Workshop EvalHub: quality (lm-evaluation-harness) + Garak + ART (garak-kfp).
# MLFLOW_TRACKING_URI must include the /mlflow static-prefix or EvalHub probes
# workspaces_enabled=false and CreateEvaluationJob fails with
# "Workspace context is required for this request."
#
# Default tenancy is multi: label DSP namespaces with
# evalhub.trustyai.opendatahub.io/tenant so the dashboard finds ConfigMap
# evalhub-discovery in the project (otherwise: "Evaluations unavailable").
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: EvalHub
metadata:
  name: evalhub
  namespace: evalhub
spec:
  replicas: 1
  database:
    type: postgresql
    secret: evalhub-db-credentials
  providers:
    - lm-evaluation-harness
    - garak
    - garak-kfp
  collections: []
  env:
    - name: MLFLOW_TRACKING_URI
      value: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow"
    - name: MLFLOW_WORKSPACE
      # Data Science Project where you create the MLflow experiment (module 8: llm)
      value: "llm"
