apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: qwen-authenticated-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Qwen authenticated access"
spec:
  modelRefs:
    # Wizard name is often qwenqwen3-06b (prefix + catalog id)
    - name: qwenqwen3-06b
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: qwen-authenticated
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Qwen authenticated"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  priority: 10
  modelRefs:
    - name: qwenqwen3-06b
      namespace: llm
      tokenRateLimits:
        - limit: 500
          window: 30s
        - limit: 5000
          window: 5m
