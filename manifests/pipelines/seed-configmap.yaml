  policy.md: |
    # Workshop GPU booking policy

    Fake GPU is not CUDA. Inference in this lab runs on CPU with Qwen3-0.6B.
    GPU Booking reserves capacity advertised as nvidia.com/gpu.
    Do not install Fake GPU on a node that already has a real NVIDIA GPU.
  testdata.json: |
    [
      {
        "query": "Does fake GPU run CUDA?",
        "response": "No. Fake GPU only advertises nvidia.com/gpu for booking; inference uses CPU."
      },
      {
        "query": "Where is Qwen published?",
        "response": "Qwen3-0.6B is published in Models as a Service via MaaSModelRef qwen3-06b."
      }
