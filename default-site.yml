---
site:
  title: OpenShift AI 3.5 — Models as a Service
  url: https://pkstaz.github.io/rhoai-maas-showroom
  start_page: modules::00-00-intro.adoc

content:
  sources:
  - url: .
    start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v0.0.1/ui-bundle.zip
    snapshot: true
  supplemental_files:
  - path: ./content/supplemental-ui
  - path: ./content/lib
  - path: .nojekyll
  - path: ui.yml
    contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
  - require: ./content/lib/dev-mode.js
    enabled: false

output:
  dir: ./www
